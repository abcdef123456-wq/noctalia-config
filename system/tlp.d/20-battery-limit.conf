# /etc/tlp.d/20-battery-limit.conf — limite de charge « Long_Life » (noctalia-config).
# Installé seulement si la batterie propose ce mode (fichier charge_types contenant Long_Life).
#   0 = Standard (charge à 100 %), 1 = Long_Life (plafond d'environ 80 %, conseillé si le PC reste souvent branché).
# Charge complète ponctuelle : sudo tlp fullcharge   ·   Pour l'enlever : sudo rm /etc/tlp.d/20-battery-limit.conf
STOP_CHARGE_THRESH_BAT0=1
