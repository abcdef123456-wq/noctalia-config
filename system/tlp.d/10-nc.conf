# /etc/tlp.d/10-nc.conf — profils énergétiques des portables (noctalia-config), TLP 1.9 et plus.
# Réglages valables pour tout portable (AMD ou Intel) : un paramètre que le matériel ne gère pas est ignoré par TLP.
#
# TLP 1.10 associe chaque profil à un suffixe de paramètres :
#   performance -> _AC   balanced -> _BAT   power-saver -> _SAV
# Le profil se choisit dans Noctalia (icône d'énergie de la barre) ou avec Super + Alt + P, via tlp-pd.
# Paramètres absents de ce fichier : valeurs par défaut de TLP (voir /usr/share/tlp/defaults.conf).

# Profil automatique : Équilibré sur secteur comme sur batterie.
# Le mode « smart » (2) conserve un choix manuel lors du branchement ou du débranchement.
TLP_AUTO_SWITCH=2
TLP_PROFILE_AC=BAL
TLP_PROFILE_BAT=BAL

# Le gouverneur CPU n'est pas imposé : le noyau choisit le bon selon le pilote (powersave + EPP avec amd-pstate
# et intel_pstate, schedutil avec acpi-cpufreq). L'EPP ci-dessous règle la réactivité quand le pilote le gère.
CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_power   # mesuré : 2 à 3 W de moins sur batterie, sans effet visible
CPU_ENERGY_PERF_POLICY_ON_SAV=power

# Boost : autorisé en Performance et en Équilibré, coupé en Économie.
# Économie : fréquence max plafonnée à 2 GHz (objectif < 15 W au repos et en usage léger). La fréquence max des
# autres profils (celle du processeur) est dans 11-nc-frequence.conf, écrit par install.sh : sans elle, le plafond
# restait après être passé une fois en Économie.
CPU_SCALING_MAX_FREQ_ON_SAV=2000000

CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=0

# Profils du firmware (ventilateurs, limites de puissance CPU/GPU), si le noyau les expose (platform_profile).
# « max-power » n'est pas utilisé : il dépasse les limites standard du constructeur.
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=balanced
PLATFORM_PROFILE_ON_SAV=low-power

# Économie PCIe (ASPM) : le réglage le plus économe sur batterie et en Économie ; sur secteur, celui du firmware.
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersupersave
PCIE_ASPM_ON_SAV=powersupersave

# Wi-Fi sans mise en veille entre deux paquets : sur batterie, TLP l'activait par défaut. Le gain est minime (quelques
# dixièmes de watt) et, sur beaucoup de cartes (MediaTek MT7921/MT7922 des portables AMD notamment), ce qui arrive est
# retardé : messages Discord en retard, voix des autres coupée en appel, alors que tout ce qui part passe bien.
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=off
