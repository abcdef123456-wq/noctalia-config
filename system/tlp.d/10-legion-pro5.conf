# /etc/tlp.d/10-legion-pro5.conf — Lenovo Legion Pro 5 16ADR10 (83LT), TLP 1.10.2
# CPU Ryzen 7 8745HX (amd-pstate-epp actif), profil plateforme lenovo-wmi-gamezone.
#
# TLP 1.10 associe chaque profil à un suffixe de paramètres :
#   performance -> _AC   balanced -> _BAT   power-saver -> _SAV
# Le profil se choisit dans Noctalia ou avec `legion-profile`, via tlp-pd (API power-profiles-daemon).
# Paramètres absents de ce fichier : valeurs par défaut de TLP (voir /usr/share/tlp/defaults.conf).

# Profil automatique : Équilibré sur secteur comme sur batterie.
# Le mode « smart » (2) conserve un choix manuel lors du branchement ou du débranchement.
TLP_AUTO_SWITCH=2
TLP_PROFILE_AC=BAL
TLP_PROFILE_BAT=BAL

# Avec amd-pstate-epp, le gouverneur reste « powersave » : l'EPP pilote la réactivité.
# (Le gouverneur « performance » bloquerait l'EPP sur « performance ».)
CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave
CPU_SCALING_GOVERNOR_ON_SAV=powersave

CPU_ENERGY_PERF_POLICY_ON_AC=performance
CPU_ENERGY_PERF_POLICY_ON_BAT=balance_performance
CPU_ENERGY_PERF_POLICY_ON_SAV=power

# Boost : autorisé en Performance et en Équilibré, coupé en Économie.
# Économie : fréquence max plafonnée à 2 GHz (objectif < 15 W au repos et en usage léger).
CPU_SCALING_MAX_FREQ_ON_SAV=2000000

CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=1
CPU_BOOST_ON_SAV=0

# Profils firmware Legion (ventilateurs, limites de puissance CPU/GPU).
# « max-power » n'est pas utilisé : il dépasse les limites standard du constructeur.
PLATFORM_PROFILE_ON_AC=performance
PLATFORM_PROFILE_ON_BAT=balanced
PLATFORM_PROFILE_ON_SAV=low-power

# Économie PCIe (ASPM) : réglage le plus économe en profil Économie uniquement.
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=default
PCIE_ASPM_ON_SAV=powersupersave

# Charge de la batterie (plugin TLP 15-lenovo, via charge_types) :
#   0 = Standard (charge à 100 %), 1 = Long_Life (plafond d'environ 80 %, conseillé si le PC reste souvent branché).
# Activé à ta demande (2026-10-10). Charge complète ponctuelle : sudo tlp fullcharge
STOP_CHARGE_THRESH_BAT0=1
