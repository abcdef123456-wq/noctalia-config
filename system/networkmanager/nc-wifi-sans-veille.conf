# /etc/NetworkManager/conf.d/nc-wifi-sans-veille.conf (noctalia-config) : Wi-Fi sans mise en veille entre deux paquets.
# Sur beaucoup de cartes (MediaTek des portables AMD notamment), cette veille retarde tout ce qui arrive : messages en
# retard, voix des autres coupée en appel. Gain d'autonomie minime. Pour l'enlever : supprimer ce fichier.
[connection]
wifi.powersave = 2
