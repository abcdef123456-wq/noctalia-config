name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: archlinux:latest
            install: pacman -Syu --noconfirm --needed python git bash jq lua procps-ng diffutils findutils gzip tar
          - image: debian:trixie
            install: apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-venv git bash lua5.4 jq procps diffutils findutils
            jq17: "1"
          - image: fedora:44
            install: dnf install -y -q python3 git bash lua jq procps-ng findutils diffutils gzip tar
          - image: opensuse/tumbleweed
            install: zypper -q --non-interactive install python3 python3-curses git bash lua54 jq procps findutils diffutils gzip tar
    steps:
      # git doit exister avant le checkout (conteneurs minimaux)
      - name: Installer les paquets
        run: ${{ matrix.install }}

      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # le jeton ne reste pas dans .git/config, lisible par les tests

      # nc-noeud refuse de tourner en root : les tests tournent sous un utilisateur ordinaire
      - name: Préparer un utilisateur ordinaire
        run: |
          useradd -m ci
          chown -R ci "$GITHUB_WORKSPACE"

      - name: Lancer les tests
        env:
          JQ17: ${{ matrix.jq17 }}
        run: |
          # shellcheck disable=SC2016
          # (les variables sont développées par le shell de ci, pas ici)
          su ci -c '
            set -e
            cd "$GITHUB_WORKSPACE"
            git config --global --add safe.directory "$GITHUB_WORKSPACE"
            if [ -n "$JQ17" ]; then
              NC_TEST_JQ17="$(command -v jq)"
              export NC_TEST_JQ17
            fi
            python3 -m unittest discover -s tests -t .
          '

  # Analyse statique, une seule fois (Arch : les outils les plus récents) : fige la propreté d'aujourd'hui. Les fichiers
  # sont trouvés par leur shebang ou leur extension : un nouveau script est couvert sans y penser.
  verifications:
    name: Vérifications (shellcheck, ruff, luac, luau, qmllint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: archlinux:latest
    steps:
      - name: Installer les outils
        run: pacman -Syu --noconfirm --needed git python shellcheck ruff lua luau qt6-declarative

      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # le jeton ne reste pas dans .git/config

      - name: shellcheck (avertissements et erreurs)
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # Scripts sh/bash/dash par leur shebang ; .shellcheckrc dit ce qui est écarté, et pourquoi
          # core.quotepath=off : les noms non ASCII (« Résumer ») sont donnés tels quels, pas entre guillemets
          for f in $(git -c core.quotepath=off ls-files 'home/.local/bin/*' 'home/.local/libexec/*' 'home/.local/share/*' install.sh export.sh get.sh); do
            head -n1 "$f" 2>/dev/null | grep -qE '^#!.*[/ ](ba|da)?sh([[:space:]]|$)' && printf '%s\0' "$f"
          done | xargs -0 shellcheck -S warning

      - name: ruff (erreurs de syntaxe et noms indéfinis)
        run: |
          { git -c core.quotepath=off ls-files '*.py'
            for f in $(git -c core.quotepath=off ls-files 'home/.local/bin/*' 'home/.local/share/*'); do
              head -n1 "$f" 2>/dev/null | grep -qE '^#!.*python' && echo "$f"
            done
          } | sort -u | tr '\n' '\0' | xargs -0 ruff check --no-cache --select E9,F63,F7,F82

      - name: luac -p (syntaxe des .lua)
        run: git -c core.quotepath=off ls-files -z '*.lua' | xargs -0 -n1 luac -p

      # Les .luau de Noctalia : syntaxe seulement (luau-compile). luau-analyze ne connaît pas l'API de Noctalia et
      # signalerait des centaines de noms inconnus
      - name: luau-compile (syntaxe des .luau)
        run: git -c core.quotepath=off ls-files -z '*.luau' | xargs -0 -n1 luau-compile --null

      - name: qmllint (l'île)
        run: python3 -m unittest -v tests.test_qmllint
