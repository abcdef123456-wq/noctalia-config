id          = "nc/sessions"
name        = "Carrousel des sessions"
version     = "1.0.0"
plugin_api  = 32
author      = "noctalia-config"
license     = "MIT"
description = "Carrousel plein écran des sessions enregistrées (nc-session) : aperçu de chacune, ouvrir, enregistrer, supprimer."

# Même cadre que le carrousel des fonds (nc/carousel). Aucune lettre capturée : une capture ne dépend pas du focus, et
# les lettres doivent toujours arriver au champ qui l'a (nom d'une nouvelle session, champs de l'éditeur). L'éditeur
# s'ouvre par le bouton « Modifier » (onKey ne reçoit que les touches capturées, et le clic droit n'existe que sur
# un ui.button).
[[panel]]
id = "main"
entry = "panel.luau"
width = "fill"
height = "fill"
placement = "floating"
position = "center"
layer = "overlay"
keyboard_focus = "exclusive"
capture_keys = ["Escape", "Left", "Right", "Up", "Down", "Tab", "shift+Tab", "ISO_Left_Tab", "Return", "KP_Enter", "Home", "End", "shift+Delete"]
