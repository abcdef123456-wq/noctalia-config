id          = "nc/sessions"
name        = "Carrousel des sessions"
version     = "1.0.0"
plugin_api  = 32
author      = "noctalia-config"
license     = "MIT"
description = "Carrousel plein écran des sessions enregistrées (nc-session) : aperçu de chacune, ouvrir, enregistrer, supprimer."

# Même cadre que le carrousel des fonds (nc/carousel). « e » : modifier la session ; capturé, il n'arrive plus au champ
# du nom d'une nouvelle session : le panneau l'y ajoute lui-même.
[[panel]]
id = "main"
entry = "panel.luau"
width = "fill"
height = "fill"
placement = "floating"
position = "center"
layer = "overlay"
keyboard_focus = "exclusive"
capture_keys = ["Escape", "Left", "Right", "Up", "Down", "Tab", "shift+Tab", "ISO_Left_Tab", "Return", "KP_Enter", "Home", "End", "shift+Delete", "e"]
