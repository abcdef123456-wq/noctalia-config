id          = "legion/launcher"
name        = "Legion Launcher"
version     = "1.0.0"
plugin_api  = 32
author      = "legion"
license     = "MIT"
description = "Barre de recherche d'applications compacte au centre de l'écran (style Spotlight)."
dependencies = ["python3"]

# Panneau de la taille de la carte, centré : cadre et flou de Noctalia, rien d'autre à l'écran.
[[panel]]
id = "main"
entry = "panel.luau"
width = "fill"
height = "fill"
placement = "floating"
position = "center"
layer = "overlay"
keyboard_focus = "exclusive"
capture_keys = ["Left", "Right", "Up", "Down", "Tab", "shift+Tab", "ISO_Left_Tab", "Return", "KP_Enter", "ctrl+j", "ctrl+k", "ctrl+n", "ctrl+p"]
