id          = "legion/carousel"
name        = "Legion Carousel"
version     = "1.0.0"
plugin_api  = 32
author      = "legion"
license     = "MIT"
description = "Carrousel plein écran pour choisir le fond d'écran (miniatures ~/.cache/legion/carousel)."

[[panel]]
id = "main"
entry = "panel.luau"
width = "fill"
height = "fill"
placement = "floating"
position = "center"
layer = "overlay"
keyboard_focus = "exclusive"
capture_keys = ["Left", "Right", "Up", "Down", "Tab", "shift+Tab", "ISO_Left_Tab", "Return", "KP_Enter", "Home", "End"]
