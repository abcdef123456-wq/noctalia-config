; Modèle noctalia-config. Pas de section [gpu] (gamemode la refuse dans le fichier de l'utilisateur).
[general]
; vide : gamemode ne touche pas au gouverneur CPU
desiredgov=

[custom]
; limite de fréquence GPU en jeu, seulement en Performance (voir docs/jeux.md) ; $HOME est développé par /bin/sh
start=$HOME/.local/bin/nc-gpu-jeu debut
end=$HOME/.local/bin/nc-gpu-jeu fin
