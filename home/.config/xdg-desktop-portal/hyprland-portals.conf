# Portails de la session Hyprland (noctalia-config) : qui répond quand une appli demande de capturer l'écran, de choisir
# un fichier, etc. Sans ce fichier, un portail de GNOME ou de KDE installé à côté (Fedora, Debian) peut être pris : il ne
# marche pas hors de son bureau, les applis Electron (Discord, VS Code…) attendent jusqu'à 25 s au démarrage, et le
# partage d'écran donne une image noire.
[preferred]
default=hyprland;gtk
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.GlobalShortcuts=hyprland
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.Settings=gtk
