# Hyprland 0.56.2 — Legion Pro 5 16ADR10
# Configuration modulaire. Chaque fichier de conf.d/ couvre un domaine.
# Les variables d'environnement de session sont dans ~/.config/uwsm/env-hyprland (lancement via uwsm).
# Sauvegarde de l'ancienne config : ~/agent-linux/backups/2026-10-10-initial/hypr/

source = ~/.config/hypr/conf.d/00-monitors.conf
source = ~/.config/hypr/conf.d/10-env.conf
source = ~/.config/hypr/conf.d/20-autostart.conf
source = ~/.config/hypr/conf.d/30-look.conf

# Couleurs générées par Noctalia (template « hyprland »), puis surcharges qui utilisent ses variables.
source = ~/.config/hypr/noctalia/noctalia-colors.conf
source = ~/.config/hypr/conf.d/35-colors.conf

source = ~/.config/hypr/conf.d/40-input.conf
source = ~/.config/hypr/conf.d/50-binds.conf
source = ~/.config/hypr/conf.d/60-rules.conf

# Réglages dépendant du profil énergétique, écrits par legion-profile-sync. Ne pas éditer à la main.
source = ~/.config/hypr/conf.d/90-profile.conf
