input {
    kb_layout = @KB_LAYOUT@
    kb_variant =
    kb_model =
    kb_options = @KB_OPTIONS@
    kb_rules =

    repeat_rate = 35
    repeat_delay = 300

    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = false
        disable_while_typing = true
        clickfinger_behavior = true
    }
}

# Gestes du pavé tactile
#   3 doigts gauche/droite : changer d'espace de travail
#   4 doigts en glissant   : déplacer la fenêtre sous le curseur
#   Alt + 4 doigts         : redimensionner la fenêtre
#   4 doigts en pincement  : détacher / remettre la fenêtre dans le pavage
gesture = 3, horizontal, workspace
gesture = 4, swipe, move
gesture = 4, swipe, mod: ALT, resize
gesture = 4, pinch, float

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}
