# Les raccourcis utilisent des keycodes : ils restent identiques en disposition US comme FR.
$mainMod = SUPER
$terminal = kitty
$fileManager = dolphin
# Actions Noctalia : legion-shell-msg les envoie à Noctalia v5
$shell = ~/.local/bin/legion-shell-msg
$menu = $shell menu

bind = $mainMod, code:36, exec, $terminal
bind = $mainMod SHIFT, code:24, killactive,
bind = $mainMod SHIFT, code:58, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, code:26, exec, $fileManager
bind = $mainMod, code:55, togglefloating,
bind = $mainMod, code:27, exec, $menu
bind = $mainMod SHIFT, code:33, pseudo,
bind = $mainMod, code:44, layoutmsg, togglesplit,
bind = $mainMod SHIFT, code:9, exec, $shell session
bind = $mainMod, code:41, fullscreenstate, 3
bind = $mainMod, code:70, exec, systemctl poweroff
bind = $mainMod, code:71, exec, systemctl reboot
bind = $mainMod, P, exec, bash -c 'grim -g "$(slurp)" - | swappy -f -'
bind = $mainMod CTRL, P, exec, ~/.local/bin/legion-pin

# Profils énergétiques (cycle Performance → Économie → Équilibré) et centre de contrôle
bind = $mainMod ALT, P, exec, $shell power-cycle
bind = $mainMod, code:54, exec, $shell control-center
bind = $mainMod, code:59, exec, $shell settings

# Fiche de tes raccourcis (Super + /) : générée en direct par legion-keys
bind = $mainMod, code:61, exec, $shell keys

# Carrousel de fonds d'écran (Super + W)
bind = $mainMod, code:25, exec, $shell wallpapers

bind = $mainMod, code:113, movefocus, l
bind = $mainMod, code:114, movefocus, r
bind = $mainMod, code:111, movefocus, u
bind = $mainMod, code:116, movefocus, d

bind = $mainMod, code:10, workspace, 1
bind = $mainMod, code:11, workspace, 2
bind = $mainMod, code:12, workspace, 3
bind = $mainMod, code:13, workspace, 4
bind = $mainMod, code:14, workspace, 5
bind = $mainMod, code:15, workspace, 6
bind = $mainMod, code:16, workspace, 7
bind = $mainMod, code:17, workspace, 8
bind = $mainMod, code:18, workspace, 9
bind = $mainMod, code:19, workspace, 10

bind = $mainMod SHIFT, code:10, movetoworkspace, 1
bind = $mainMod SHIFT, code:11, movetoworkspace, 2
bind = $mainMod SHIFT, code:12, movetoworkspace, 3
bind = $mainMod SHIFT, code:13, movetoworkspace, 4
bind = $mainMod SHIFT, code:14, movetoworkspace, 5
bind = $mainMod SHIFT, code:15, movetoworkspace, 6
bind = $mainMod SHIFT, code:16, movetoworkspace, 7
bind = $mainMod SHIFT, code:17, movetoworkspace, 8
bind = $mainMod SHIFT, code:18, movetoworkspace, 9
bind = $mainMod SHIFT, code:19, movetoworkspace, 10

bind = $mainMod, code:23, togglespecialworkspace, magic

# Passer d'une fenêtre à l'autre (carrousel) : Alt + Tab, ou Super + Alt + Tab
bind = $mainMod ALT, code:23, exec, $shell window-switcher
bind = ALT, code:23, exec, $shell window-switcher
bind = ALT SHIFT, code:23, exec, $shell window-switcher

# Terminal déroulant : Super + ² (touche sous Échap) ; kitty est lancé au premier appel.
bind = $mainMod, code:49, togglespecialworkspace, term

# Fenêtres groupées en onglets : Super+G grouper/dégrouper, Super+Ctrl+Tab onglet suivant, Super+Maj+Tab précédent, Super+Shift+G sortir du groupe
bind = $mainMod, code:42, togglegroup,
bind = $mainMod CTRL, code:23, changegroupactive, f
bind = $mainMod SHIFT, code:23, changegroupactive, b
bind = $mainMod SHIFT, code:42, moveoutofgroup,

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Souris, pavage : Super + glisser (clic gauche) = déplacer la tuile (lâcher sur une autre fenêtre pour la placer
# à côté, du côté où se trouve le curseur) ; Super + clic droit = redimensionner. Les bords se tirent aussi sans touche.
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Souris, placement libre : Super + Alt + glisser = détacher la fenêtre et la poser où tu veux (aimantée aux bords
# et aux autres fenêtres) ; Super + Alt + clic droit = la détacher et la redimensionner librement.
# Super + V la remet dans le pavage.
bind = $mainMod ALT, mouse:272, setfloating
bindm = $mainMod ALT, mouse:272, movewindow
bind = $mainMod ALT, mouse:273, setfloating
bindm = $mainMod ALT, mouse:273, resizewindow

# Pavé tactile : Super + Maj + appuyer-glisser (un doigt) = détacher la fenêtre et la redimensionner librement
bind = $mainMod SHIFT, mouse:272, setfloating
bindm = $mainMod SHIFT, mouse:272, resizewindow

# Clavier : Super + Ctrl + flèches = agrandir / rétrécir la fenêtre (maintenir pour répéter)
binde = $mainMod CTRL, code:113, resizeactive, -40 0
binde = $mainMod CTRL, code:114, resizeactive, 40 0
binde = $mainMod CTRL, code:111, resizeactive, 0 -40
binde = $mainMod CTRL, code:116, resizeactive, 0 40

# Verrouiller l'écran (sans mise en veille)
bind = $mainMod, code:46, exec, $shell lock
bind = $mainMod SHIFT, code:113, movewindow, l
bind = $mainMod SHIFT, code:114, movewindow, r
bind = $mainMod SHIFT, code:111, movewindow, u
bind = $mainMod SHIFT, code:116, movewindow, d

# Touches multimédia
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, ~/.local/bin/legion-brightness up
bindel = , XF86MonBrightnessDown, exec, ~/.local/bin/legion-brightness down

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86PowerOff, exec, ~/.local/bin/legion-finger
