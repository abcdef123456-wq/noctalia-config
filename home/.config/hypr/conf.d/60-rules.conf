# Règles de fenêtres (syntaxe match: de Hyprland 0.53 et suivantes)
windowrule = suppress_event maximize, match:class .*
windowrule = no_initial_focus on, match:class ^$, match:title ^$
windowrule = float on, move 20 monitor_h-120, match:class hyprland-run

# Fenêtres utilitaires en flottant
windowrule = float on, center on, size 900 600, match:class ^(org.pulseaudio.pavucontrol|com.saivert.pwvucontrol|nm-connection-editor|blueman-manager)$
windowrule = float on, center on, match:class ^(org.kde.polkit-kde-authentication-agent-1|polkit-kde-authentication-agent-1)$

# Incrustation vidéo de Firefox : flottante, épinglée sur tous les espaces, en bas à droite
windowrule = float on, pin on, keep_aspect_ratio on, size 480 270, move (monitor_w-500) (monitor_h-290), match:title ^(Picture-in-Picture|Incrustation vidéo)$

# Terminal déroulant (Super + ²)
workspace = special:term, on-created-empty:kitty --class dropterm
windowrule = float on, size (monitor_w*0.72) (monitor_h*0.62), center on, match:class ^(dropterm)$

# Pas d'économiseur d'écran pendant une vidéo en plein écran
windowrule = idle_inhibit fullscreen, match:class .*

# Noctalia v5 : flou derrière la barre, les panneaux, le dock, l'OSD et le sélecteur de fenêtres ;
# animations Hyprland coupées sur ces surfaces (Noctalia anime elle-même). Règle de la documentation officielle v5.
layerrule {
    name = noctalia-v5
    match:namespace = ^noctalia-(bar-.+|notification|dock|panel|attached-panel|osd|window-switcher)$
    no_anim = true
    ignore_alpha = 0.5
    blur = true
    blur_popups = true
}
