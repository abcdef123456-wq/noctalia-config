# Apparence : sombre, épurée, rayons alignés sur Noctalia.
# Le flou et les ombres sont coupés en profil Économie par 90-profile.conf.

general {
    gaps_in = 4
    gaps_out = 10
    border_size = 2
    resize_on_border = true
    extend_border_grab_area = 20
    allow_tearing = false
    layout = dwindle

    # Aimantation des fenêtres flottantes aux bords de l'écran et aux autres fenêtres
    snap {
        enabled = true
        window_gap = 14
        monitor_gap = 14
        respect_gaps = true
    }
}

decoration {
    rounding = 14
    rounding_power = 2.5

    active_opacity = 1.0
    inactive_opacity = 1.0
    dim_special = 0.35

    # Fenêtres inactives légèrement assombries : la fenêtre active ressort.
    dim_inactive = true
    dim_strength = 0.10

    # Couleurs (halo de la teinte du fond d'écran) : 35-colors.conf, généré par legion-theme-sync.
    shadow {
        enabled = true
        range = 22
        render_power = 3
        offset = 0 4
        color = rgba(00000088)
        color_inactive = rgba(00000044)
    }

    # Valeurs modérées : l'iGPU Radeon 610M doit tenir 2560x1600 à 165 Hz.
    blur {
        enabled = true
        size = 3
        passes = 2
        noise = 0.015
        contrast = 0.9
        brightness = 1.0
        vibrancy = 0.17
        popups = true
        new_optimizations = true
        xray = false
    }
}

animations {
    enabled = true

    bezier = emphasized, 0.05, 0.7, 0.1, 1
    bezier = emphasizedAccel, 0.3, 0, 0.8, 0.15
    bezier = standard, 0.2, 0, 0, 1
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = linear, 0, 0, 1, 1

    animation = global,        1, 5,   standard
    animation = border,        1, 5,   standard
    animation = windowsIn,     1, 4,   emphasized, popin 90%
    animation = windowsOut,    1, 2.5, emphasizedAccel, popin 90%
    animation = windowsMove,   1, 4,   emphasized, slide
    animation = fadeIn,        1, 3,   standard
    animation = fadeOut,       1, 2,   emphasizedAccel
    animation = layersIn,      1, 3,   emphasized, fade
    animation = layersOut,     1, 2,   emphasizedAccel, fade
    animation = fadeLayersIn,  1, 2.5, standard
    animation = fadeLayersOut, 1, 2,   standard
    animation = workspaces,    1, 3.5, emphasized, slidefadevert 15%
    animation = specialWorkspace, 1, 3.5, emphasized, slidefadevert 15%
    animation = zoomFactor,    1, 5,   standard
}

# Fenêtres groupées en onglets (Super+G) : onglets arrondis au-dessus du groupe.
group {
    groupbar {
        enabled = true
        font_family = Adwaita Sans
        font_size = 11
        height = 20
        indicator_height = 0
        rounding = 8
        gradients = true
        gradient_rounding = 8
        gaps_in = 4
        gaps_out = 4
        keep_upper_gap = true
    }
}

dwindle {
    preserve_split = true
    smart_split = false
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(0b0d12)
    animate_manual_resizes = false
    focus_on_activate = true
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

cursor {
    inactive_timeout = 8
    hide_on_key_press = true
}

xwayland {
    force_zero_scaling = true
}
