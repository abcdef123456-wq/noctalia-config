# hypridle : mise en veille automatique.
# Respecte les inhibitions : vidéo plein écran, Firefox, bouton « Rester éveillé » (KeepAwake) de Noctalia.
# Délais : assombrir 2 min 30 → verrouiller 5 min → écran éteint 5 min 30 → veille 15 min (portable sur batterie uniquement).
# Sur batterie seulement : assombrir après 1 min, écran verrouillé éteint après 1 min (VEILLE_BAISSE_BATTERIE,
# VEILLE_ECRAN_BATTERIE de nc-reglages). Sur secteur et sur un PC de bureau, rien ne change.

general {
    # Verrouillage : écran de verrouillage de Noctalia
    lock_cmd = ~/.local/bin/nc-shell-msg lock
    # Noctalia ne verrouille pas tout seul quand la veille vient du couvercle ou de systemd.
    before_sleep_cmd = loginctl lock-session && sleep 1
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    # Marque « écran verrouillé », quel que soit le verrouillage (Super + L, automatique, couvercle) : lue par
    # l'écran éteint sur batterie, plus bas
    on_lock_cmd = touch "$XDG_RUNTIME_DIR/nc-verrouille"
    on_unlock_cmd = rm -f "$XDG_RUNTIME_DIR/nc-verrouille"
}

# Assombrit à 20 % (seulement si l'écran est plus lumineux), restaure au retour.
# Déjà assombri sur batterie (listener suivant) : rien, sinon le niveau mémorisé serait celui déjà assombri.
listener {
    timeout = 150
    on-timeout = sh -c '[ -e "$XDG_RUNTIME_DIR/nc-baisse-batterie" ] || exec ~/.local/bin/nc-brightness dim'
    on-resume = ~/.local/bin/nc-brightness restore
}

# Sur batterie : assombrit plus tôt. Sur secteur (ou sans batterie), rien, et rien à restaurer au retour.
listener {
    timeout = 60
    on-timeout = sh -c 'rm -f "$XDG_RUNTIME_DIR/nc-baisse-batterie"; ls -d /sys/class/power_supply/BAT* >/dev/null 2>&1 || exit 0; for s in /sys/class/power_supply/*; do [ "$(cat $s/type)" = Mains ] && [ "$(cat $s/online)" = 1 ] && exit 0; done; touch "$XDG_RUNTIME_DIR/nc-baisse-batterie"; exec ~/.local/bin/nc-brightness dim'
    on-resume = sh -c 'rm "$XDG_RUNTIME_DIR/nc-baisse-batterie" 2>/dev/null && exec ~/.local/bin/nc-brightness restore; exit 0'
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Écran éteint : économise l'énergie (et évite le marquage sur un écran OLED).
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Sur batterie, écran verrouillé : éteint plus tôt (personne ne le regarde). Sur secteur, ou pas verrouillé : rien.
# ([[off]] : chaîne Lua sans guillemets, la commande étant déjà entre apostrophes)
listener {
    timeout = 60
    on-timeout = sh -c 'rm -f "$XDG_RUNTIME_DIR/nc-ecran-batterie"; [ -e "$XDG_RUNTIME_DIR/nc-verrouille" ] || exit 0; ls -d /sys/class/power_supply/BAT* >/dev/null 2>&1 || exit 0; for s in /sys/class/power_supply/*; do [ "$(cat $s/type)" = Mains ] && [ "$(cat $s/online)" = 1 ] && exit 0; done; touch "$XDG_RUNTIME_DIR/nc-ecran-batterie"; exec hyprctl dispatch "hl.dsp.dpms({ action = [[off]] })"'
    on-resume = sh -c 'rm "$XDG_RUNTIME_DIR/nc-ecran-batterie" 2>/dev/null && exec hyprctl dispatch "hl.dsp.dpms({ action = [[on]] })"; exit 0'
}

listener {
    timeout = 900
    on-timeout = sh -c 'ls -d /sys/class/power_supply/BAT* >/dev/null 2>&1 || exit 0; for s in /sys/class/power_supply/*; do [ "$(cat $s/type)" = Mains ] && [ "$(cat $s/online)" = 1 ] && exit 0; done; systemctl suspend'
}
