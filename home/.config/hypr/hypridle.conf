# hypridle 0.1.8 : mise en veille automatique (agent-linux).
# Respecte les inhibitions : vidéo plein écran, Firefox, bouton « Rester éveillé » (KeepAwake) de Noctalia.
# Délais : assombrir 2 min 30 → verrouiller 5 min → écran éteint 5 min 30 → veille 15 min (sur batterie uniquement).

general {
    lock_cmd = qs -c noctalia-shell ipc call lockScreen lock
    # Noctalia ne verrouille pas tout seul quand la veille vient du couvercle ou de systemd.
    before_sleep_cmd = loginctl lock-session && sleep 1
    after_sleep_cmd = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# Assombrit à 20 % (seulement si l'écran est plus lumineux), restaure au retour.
listener {
    timeout = 150
    on-timeout = sh -c 'brightnessctl -s -q -d amdgpu_bl2; b=$(brightnessctl -d amdgpu_bl2 -m | cut -d, -f4 | tr -d %); [ "$b" -gt 20 ] && brightnessctl -q -d amdgpu_bl2 set 20%'
    on-resume = brightnessctl -r -q -d amdgpu_bl2
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Écran OLED éteint : évite le marquage et économise l'énergie.
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 900
    on-timeout = sh -c 'for s in /sys/class/power_supply/*; do [ "$(cat $s/type)" = Mains ] && [ "$(cat $s/online)" = 1 ] && exit 0; done; systemctl suspend'
}
