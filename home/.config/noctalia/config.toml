# Noctalia v5 — configuration du dépôt noctalia-config.
# Les réglages faits dans l'interface vont dans ~/.local/state/noctalia/settings.toml et priment sur ce fichier.
# Clés vérifiées avec « noctalia config export full » (v5.2.1) et docs.noctalia.dev.

[shell]
font_family = "Adwaita Sans"
avatar_path = "@HOME@/.face"
corner_radius_scale = 1.0
setup_wizard_enabled = false
telemetry_enabled = false
polkit_agent = @POLKIT@   # demandes de mot de passe : agent de Noctalia, sauf si celui de KDE est installé (install.sh)
# Applis lancées dans leur propre unité systemd (elles survivent au changement v4/v5)
# et sur le GPU du profil énergétique (nc-launch).
launch_apps_custom_command = "uwsm-app -- @HOME@/.local/bin/nc-launch $CMD"

[shell.animation]
speed = 1.15

[shell.shadow]
direction = "down"
alpha = 0.5

[shell.panel]
transparency_mode = "glass"               # panneaux en verre dépoli (flou Hyprland derrière)
borders = true
list_item_background = true
launcher_placement = "floating"
launcher_position = "center"
control_center_placement = "attached"
wallpaper_placement = "floating"
wallpaper_position = "center"
session_placement = "floating"
session_position = "center"

[shell.launcher]
categories = false
compact = false
sort_by_usage = true
pinned = ["@BROWSER@", "kitty", "org.gnome.Nautilus"]

# Coins de l'écran arrondis (masque noir dans les 4 coins)
[shell.screen_corners]
enabled = true
size = 20

[shell.window_switcher]
style = "carousel"
mru = true

# Clé de chiffrement de l'historique du presse-papier : fichier privé (0600) au lieu du trousseau de clés,
# qui affichait une demande de mot de passe au démarrage.
[storage]
key_source = "file"
key_file = "@HOME@/.local/state/noctalia/storage.key"

# ---------------------------------------------------------------- Barre
[bar.default]
position = "top"
thickness = 36
margin_edge = 6                           # barre flottante, détachée du bord
margin_ends = 10
concave_edge_corners = false
background_opacity = 0.0                  # barre transparente : seules les pastilles sont visibles
compositor_blur = false                   # le flou vient de la règle Hyprland (pastilles seulement)
shadow = false
capsule = true
capsule_fill = "surface"
capsule_opacity = 0.82
capsule_thickness = 0.86
capsule_padding = 8
widget_spacing = 6
font_weight = 600
start = ["logo", "workspaces", "active_window"]
center = [@ILE_CENTRE@]                    # île dynamique : île Quickshell par-dessus la barre (vide ici) ou plugin nc/ile
end = ["group:sys", "tray", "power_profile", "group:status"@NOTIF_WIDGET@]

[[bar.default.capsule_group]]
id = "sys"
members = ["cpu", "temp", "ram"]

[[bar.default.capsule_group]]
id = "status"
members = ["network", "bluetooth", "volume", "battery"]

[widget.logo]
type = "control-center"
custom_image = "@DISTRO_LOGO@"   # logo de ta distribution (install.sh) ; vide = icône de Noctalia
custom_image_colorize = true
color = "primary"


[widget.logo.actions]
left = "exec @HOME@/.local/bin/nc-shell-msg ile centre"   # l'île (sinon le centre de contrôle de Noctalia)
[widget.workspaces]
# Épuré : chiffres des bureaux occupés en couleur secondaire du fond, bureau actif = pilule allongée aux couleurs du fond, vides = discrets
style = "regular"
show_labels = true
labels_only_when_occupied = true
focused_color = "primary"
occupied_color = "secondary"
empty_color = "outline"
active_pill_size = 2.6
inactive_pill_size = 0.6

# Île dynamique : sa propre pilule noire, sans la pastille de la barre
[widget."nc/ile:pilule"]
capsule = false

[widget.active_window]
max_length = 240.0
title_scroll = "on_hover"

[widget.clock]
format = "{:%a %d %b   %H:%M}"

[widget.media]
hide_when_no_media = true
max_length = 200.0

[widget.cpu]
type = "sysmon"
stat = "cpu_usage"
visualization = "none"


[widget.cpu.actions]
left = "exec @HOME@/.local/bin/nc-shell-msg ile systeme"   # l'île (sinon le centre de contrôle de Noctalia)
[widget.temp]
type = "sysmon"
stat = "cpu_temp"
visualization = "none"


[widget.temp.actions]
left = "exec @HOME@/.local/bin/nc-shell-msg ile systeme"   # l'île (sinon le centre de contrôle de Noctalia)
[widget.ram]
type = "sysmon"
stat = "ram_used"
visualization = "none"


[widget.ram.actions]
left = "exec @HOME@/.local/bin/nc-shell-msg ile systeme"   # l'île (sinon le centre de contrôle de Noctalia)
[widget.network]
show_label = false


[widget.network.actions]
left = "exec @HOME@/.local/bin/nc-shell-msg ile reseau"   # l'île (sinon le centre de contrôle de Noctalia)
[widget.volume]
show_label = false


[widget.volume.actions]
left = "exec @HOME@/.local/bin/nc-shell-msg ile son"   # l'île (sinon le centre de contrôle de Noctalia)
[widget.battery]
display_mode = "graphic"
show_label = true


[widget.battery.actions]
left = "exec @HOME@/.local/bin/nc-shell-msg ile systeme"   # l'île (sinon le centre de contrôle de Noctalia)
[widget.bluetooth]

[widget.bluetooth.actions]
left = "exec @HOME@/.local/bin/nc-shell-msg ile bluetooth"   # l'île (sinon le centre de contrôle de Noctalia)

[widget.notifications]
hide_when_no_unread = false


# Clic droit sur une zone vide de la barre : centre de contrôle de l'île (sinon celui de Noctalia)
[bar.default.dead_zone.actions]
right = "exec @HOME@/.local/bin/nc-shell-msg ile centre"
# ---------------------------------------------------------------- Dock
[dock]
enabled = true
auto_hide = true
reserve_space = false
# Verre dépoli : fond translucide flouté par Hyprland (nc/regles.lua), forme de pilule, sans contour, ombre douce
background_opacity = 0.45
radius = 26
border_width = 0.0
shadow = true
margin_edge = 10                          # flotte au-dessus du bord de l'écran
concave_edge_corners = false
icon_size = 48
item_spacing = 10
main_axis_padding = 10
cross_axis_padding = 8
magnification = true
magnification_scale = 1.35                # loupe légère
inactive_opacity = 1.0                    # toutes les icônes nettes et de la même taille
inactive_scale = 1.0
show_dots = true                          # un point sous les applis ouvertes, sans pastille de nombre
show_instance_count = false
pinned = ["@BROWSER@", "kitty", "org.gnome.Nautilus"]

# ---------------------------------------------------------------- Notifications, OSD
[notification]
position = "top_right"
enable_daemon = @NOTIF_NOCTALIA@                     # false : notifications affichées par l'île dynamique (nc-ile)

[osd]
enabled = false                           # bulles de volume / luminosité : l'île dynamique (nc/ile) les remplace
position = "bottom_center"

# ---------------------------------------------------------------- Thème : couleurs du fond d'écran
# Couleurs vives ou sobres selon le fond (et image de démarrage) : voir nc-wallpaper-colors
[hooks]
wallpaper_changed = "$HOME/.local/bin/nc-wallpaper-colors"

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "vibrant"

[theme.templates]
enable_builtin_templates = true
builtin_ids = ["gtk3", "gtk4", "qt", "kcolorscheme"]
enable_community_templates = false

# Palette au format v4 : nc-theme-sync (kitty, bordures Hyprland, applis KDE, logo du terminal) la surveille
[theme.templates.user.nc_colors]
input_path = "templates/colors.json"
output_path = "@HOME@/.config/noctalia/colors.json"

# ---------------------------------------------------------------- Fonds d'écran : rotation 10 min, fondu enchaîné 1,2 s
[wallpaper]
directory = "@HOME@/Pictures/Wallpapers"
fill_mode = "crop"
transition = ["fade"]
transition_duration = 1200.0

[wallpaper.automation]
enabled = true
interval_seconds = 600
order = "random"

[lockscreen]
transition = ["disc"]
blur_intensity = 0.15                     # fond presque net, comme sur iPhone (flou léger)

# Écran de verrouillage façon iPhone (plugin nc/verrou) : cadenas, date et très grande heure en haut ; musique en
# longue capsule façon île ; mot de passe dans une simple pilule ; batterie quand le PC est branché
[lockscreen_widgets]
enabled = true
widget_order = ["nc-heure", "nc-musique", "lockscreen-login-box@@MONITOR@", "nc-batterie"]

[lockscreen_widgets.widget.nc-heure]
type = "nc/verrou:heure"
output = "@MONITOR@"
cx = @LCX@
cy = @LCY1@
box_width = 640.0
box_height = 280.0

[lockscreen_widgets.widget.nc-heure.settings]
background = false

[lockscreen_widgets.widget.nc-musique]
type = "nc/verrou:musique"
output = "@MONITOR@"
cx = @LCX@
cy = @LCY3@
box_width = 680.0                         # longue capsule (sans taille : boîte carrée)
box_height = 104.0

[lockscreen_widgets.widget.nc-musique.settings]
background = false                        # pas de cadre autour : la capsule dessine son propre fond

[lockscreen_widgets.widget."lockscreen-login-box@@MONITOR@"]
type = "login_box"
output = "@MONITOR@"
cx = @LCX@
cy = @LCY4@
box_width = 360.0
box_height = 56.0

[lockscreen_widgets.widget."lockscreen-login-box@@MONITOR@".settings]
layout = "compact"
background_opacity = 0.0                  # pas de cadre : seulement la pilule du mot de passe
background_radius = 28.0
input_radius = 28.0
input_opacity = 0.35
center_password_text = true
show_login_button = false
show_keyboard_layout = false
show_media = false                        # la musique est dans sa propre capsule (nc-musique)
show_session_buttons = false
show_unlock_hint = false                  # pas de bandeau « Saisissez votre mot de passe… »
show_caps_lock = true

[lockscreen_widgets.widget.nc-batterie]
type = "nc/verrou:batterie"
output = "@MONITOR@"
cx = @LCX@
cy = @LCY5@
box_width = 200.0
box_height = 40.0

[lockscreen_widgets.widget.nc-batterie.settings]
background = false

# ---------------------------------------------------------------- Plugins locaux (~/.local/share/noctalia/plugins)
[plugins]
enabled = ["nc/launcher", "nc/carousel", "nc/keys", "nc/verrou"@PLUGIN_ILE@]
auto_update = "none"
