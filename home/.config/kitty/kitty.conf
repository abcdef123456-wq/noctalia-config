include themes/noctalia-dynamic.conf
background_opacity 0.88
allow_remote_control yes

# Curseur smooth style Jakoolit
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
cursor_stop_blinking_after 0
cursor_trail 3
cursor_trail_decay 0.1 0.4

# scrolling_speed 2.0  (clé inconnue de kitty, désactivée par agent-linux)
# scrolling_fps 120  (clé inconnue de kitty, désactivée par agent-linux)
scrollback_lines 10000

font_family CaskaydiaCove Nerd Font Mono
# enable_ligatures yes  (clé inconnue de kitty, désactivée par agent-linux)

# enable_c2rust_graphics true  (clé inconnue de kitty, désactivée par agent-linux)
allow_remote_control yes





# Ajouts agent-linux
window_padding_width 8 10
hide_window_decorations yes
tab_bar_style powerline
tab_powerline_style slanted
