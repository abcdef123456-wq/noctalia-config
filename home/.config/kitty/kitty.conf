# kitty : terminal assorti au fond d'écran (couleurs écrites par nc-theme-sync, rechargées à chaud).
include themes/noctalia-dynamic.conf

font_family CaskaydiaCove Nerd Font Mono
background_opacity 0.88
window_padding_width 8 10
hide_window_decorations yes
scrollback_lines 10000
allow_remote_control yes

# Curseur fin, avec une traînée douce
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.5
cursor_stop_blinking_after 0
cursor_trail 3
cursor_trail_decay 0.1 0.4

tab_bar_style powerline
tab_powerline_style slanted

# Opacité et taille du texte choisies avec nc-reglages (fichier écrit par la commande)
globinclude nc-reglages.conf
# Tes réglages personnels : ~/.config/kitty/perso.conf (jamais remplacé par install.sh)
globinclude perso.conf
