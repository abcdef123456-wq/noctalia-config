# noctalia-config : l'agent polkit de KDE (fenêtres de mot de passe) attend que la session graphique soit là. Sans cet
# ordre, il démarrait en même temps que Hyprland (sous uwsm), avant l'écran : 5 plantages en une seconde (« could not
# connect to display »), puis systemd abandonnait et plus aucune demande de mot de passe ne s'affichait.
[Unit]
After=graphical-session.target
StartLimitIntervalSec=30
StartLimitBurst=10

[Service]
RestartSec=2
